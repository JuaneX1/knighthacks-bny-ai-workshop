<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Wars</title>
    <script>
      (function () {
        var stored = localStorage.getItem('ctf_theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        // Apply the player's team colors before first paint (see src/lib/teamTheme.js).
        var team = localStorage.getItem('ctf_team');
        if (team && ['/defend', '/attack', '/waiting'].indexOf(location.pathname) !== -1) {
          document.documentElement.setAttribute('data-team', team);
        }
      })();
    </script>
  </head>
  <body class="bg-void text-ink">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
